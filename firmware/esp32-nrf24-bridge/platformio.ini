[common]
monitor_speed = 115200
upload_speed = 921600

; Waveshare ESP32-C6-LCD-1.47 — display only, 4MB flash, ST7789 (no touch)
[env:waveshare_c6_lcd_147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino
board_build.f_cpu = 160000000L
board_build.partitions = partitions/waveshare_4mb.csv
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = ${common.upload_speed}
build_flags =
    -DBOARD_WAVESHARE_C6_LCD_147
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.5
    h2zero/NimBLE-Arduino@^2.2.3
    dparson55/NRFLite@^3.1.2

; NRF24 only — no LCD / BLE / main app
; Flash + serial: pio run -e nrf24_test -t upload -t monitor
[env:nrf24_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = ${common.upload_speed}
src_dir = test/nrf24_bench
lib_deps =
    dparson55/NRFLite@^3.1.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
targets =
    upload
    monitor

; Alias for older command
[env:esp32c6_lcd_147]
extends = env:waveshare_c6_lcd_147

; Plain ESP32 on USB (e.g. ESP32-WROOM devkit)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags = -DBOARD_ESP32DEV
lib_deps =
    olikraus/U8g2@^2.36.5
    dparson55/NRFLite@^3.1.2
    arduino-libraries/ArduinoBLE@^1.3.6

; Heltec WiFi LoRa 32 V3 (ESP32-S3 + OLED)
[env:heltec_lora_32_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags = -DBOARD_HELTEC_LORA_32_V3
lib_deps =
    olikraus/U8g2@^2.36.5
    dparson55/NRFLite@^3.1.2
    arduino-libraries/ArduinoBLE@^1.3.6
